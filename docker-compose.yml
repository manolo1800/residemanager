name: sgc

services:
  postgres:
    image: postgres:16-alpine
    container_name: sgc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sgc}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sgc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: docker.io/cortexproject/minio:RELEASE.2024-07-04T14-25-45Z
    container_name: sgc-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sgc-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-super-secret-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: docker.io/cortexproject/minio:RELEASE.2024-07-04T14-25-45Z
    container_name: sgc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-sgc-admin} $${MINIO_ROOT_PASSWORD:-super-secret-password};
      mc mb --ignore-existing local/sgc-local;
      mc anonymous set none local/sgc-local;
      echo 'MinIO sgc-local bucket initialized';
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    container_name: sgc-api
    restart: unless-stopped
    command: pnpm --filter api dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sgc
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: sgc-local
      S3_ACCESS_KEY: sgc-admin
      S3_SECRET_KEY: super-secret-password
      S3_FORCE_PATH_STYLE: "true"
      S3_USE_SSL: "false"
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - contracts_node_modules:/app/packages/contracts/node_modules
      - database_node_modules:/app/packages/database/node_modules
      - i18n_node_modules:/app/packages/i18n/node_modules
      - ui_node_modules:/app/packages/ui/node_modules
      - pnpm_store:/root/.local/share/pnpm/store

  web:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    container_name: sgc-web
    restart: unless-stopped
    command: pnpm --filter web dev
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      INTERNAL_API_URL: http://api:3001/api/v1


    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - contracts_node_modules:/app/packages/contracts/node_modules
      - database_node_modules:/app/packages/database/node_modules
      - i18n_node_modules:/app/packages/i18n/node_modules
      - ui_node_modules:/app/packages/ui/node_modules
      - next_cache:/app/apps/web/.next
      - pnpm_store:/root/.local/share/pnpm/store

volumes:
  postgres_data:
  redis_data:
  minio_data:
  root_node_modules:
  api_node_modules:
  web_node_modules:
  contracts_node_modules:
  database_node_modules:
  i18n_node_modules:
  ui_node_modules:
  next_cache:
  pnpm_store:
